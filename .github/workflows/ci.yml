name: HEXTA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend Security Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsofthsm2 libengine-pkcs11-openssl

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run autonomous security tests
        working-directory: backend
        run: |
          python -m pytest \
            tests/test_audit_chain_contract.py \
            tests/test_ceremony_actions_api.py \
            -v --tb=short

  frontend:
    name: React TypeScript Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  postgres-integration:
    name: PostgreSQL Integration Tests
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bankkey
          POSTGRES_USER: bankkey
          POSTGRES_PASSWORD: ci_test_password_only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bankkey -d bankkey"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BANKKEY_DB_PASSWORD: ci_test_password_only
      BANKKEY_TEST_DATABASE: ci_ephemeral_only
      BANKKEY_JWT_SECRET: ci_only_jwt_signing_secret_32_characters_minimum_2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply Alembic migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Verify database revision
        working-directory: backend
        run: python -m alembic current

      - name: Run PostgreSQL integration smoke tests
        working-directory: backend
        run: |
          python -m pytest \
            tests/test_postgresql_integration.py \
            tests/test_ceremony_concurrency.py \
            tests/test_audit_integrity.py \
            tests/test_ceremony_actions_api.py \
            tests/test_audit_api.py \
            -v --tb=short
